name: build-full-oxt

# Rakentaa itsenäisen punakyna-full-macos.oxt:n: LibreOffice-laajennus,
# jossa mukana libvoikko + riippuvuudet + voikko-fi-sanasto +
# lisenssit + vastaava lähdekoodi erillisenä artefaktina.
# Standard public runners have free compute, but artifact storage is quota-based.
# Manual only. Standard public macOS runner; no Actions artifacts or cache.
# Successful host-checked files go to a draft GitHub release, never auto-publish.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  macos-bundle:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Asenna voikko-pino (libvoikko + hfstospell + voikko-fi)
        run: brew install libvoikko

      - name: Kokoa natiivit, lisenssit ja lähteet
        run: python3 adapters/libreoffice/xproofreader/ci_collect_macos.py

      - name: Rakenna täysi OXT
        run: |
          mkdir -p dist
          python3 adapters/libreoffice/xproofreader/make_oxt.py \
            dist/punakyna-full-macos.oxt
          python3 adapters/libreoffice/xproofreader/verify_macos_signatures.py dist/punakyna-full-macos.oxt
          ls -la dist/

      - name: 'Runtime smoke: pakattu moottori ilman Homebrewia'
        run: |
          set -e
          PREFIX=$(brew --prefix)
          mv "$PREFIX/lib/voikko" "$PREFIX/lib/voikko.hidden"
          for f in "$PREFIX"/lib/libvoikko*.dylib "$PREFIX"/lib/libhfstospell*.dylib; do
            [ -e "$f" ] && mv "$f" "$f.hidden"
          done
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          unzip -q dist/punakyna-full-macos.oxt -d /tmp/smoke
          DYLD_PRINT_LIBRARIES=1 python3 \
            adapters/libreoffice/xproofreader/ci_smoke_check.py /tmp/smoke \
            2> >(tee /tmp/dyld.log >&2)
          echo '--- ladatut voikko/hfst-kirjastot ---'
          grep -E 'libvoikko|libhfstospell' /tmp/dyld.log | sort -u | head
          echo '--- tarkistus: mitaan ei saa latautua Homebrew:sta ---'
          if grep -E '/opt/homebrew.*(voikko|hfst|archive|icu|lz4|lzma|zstd|libb2)' \
               /tmp/dyld.log; then
            echo 'VIRHE: Homebrew-kirjasto latautui' && exit 1
          fi
          echo 'OK: koko riippuvuusketju tuli paketista'

      - name: 'Smoke: paketin sisältö'
        run: |
          unzip -l dist/punakyna-full-macos.oxt | grep -E 'dylib|mor-standard|SOURCES|GPL|Apache'

      - name: Paketoi lähteet + rakennusohje
        run: |
          mkdir -p dist/corresponding-sources/build-recipe
          cp adapters/libreoffice/xproofreader/ci_collect_macos.py \
             adapters/libreoffice/xproofreader/bundle_native.py \
             adapters/libreoffice/xproofreader/make_oxt.py \
             adapters/libreoffice/xproofreader/verify_macos_signatures.py \
             .github/workflows/build-full-oxt.yml \
             dist/corresponding-sources/build-recipe/
          cp adapters/libreoffice/xproofreader/SOURCES-README.md \
             dist/corresponding-sources/README.md
          cp -r adapters/libreoffice/xproofreader/.ci-staging/licenses \
             dist/corresponding-sources/licenses
          tar -czf dist/punakyna-corresponding-sources.tar.gz \
            -C dist corresponding-sources
          ls -la dist/

      - name: Install actual arm64 LibreOffice host
        run: |
          test "$(uname -m)" = arm64
          brew install --cask libreoffice
          test -x /Applications/LibreOffice.app/Contents/Resources/python
          /Applications/LibreOffice.app/Contents/Resources/python -c 'import uno; print("UNO Python ready")'

      - name: Real LibreOffice.app callback and correction smoke
        run: |
          python3 adapters/libreoffice/xproofreader/test_macos_host.py \
            --oxt dist/punakyna-full-macos.oxt \
            --uno-python /Applications/LibreOffice.app/Contents/Resources/python

      - name: Stage checked files in draft release (no Actions storage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="punakyna-macos-candidate-${GITHUB_RUN_ID}"
          shasum -a 256 dist/punakyna-full-macos.oxt dist/punakyna-corresponding-sources.tar.gz > dist/SHA256SUMS.txt
          printf '%s\n' \
            'Signed arm64 test candidate. Signature verification, standalone engine and actual LibreOffice.app UNO host smoke passed.' \
            'GUI F7, visible underline and user-click correction remain unverified. Draft only; not a public release.' \
            > dist/release-notes.txt
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Punakynä macOS test candidate $GITHUB_RUN_ID" \
            --notes-file dist/release-notes.txt \
            dist/punakyna-full-macos.oxt \
            dist/punakyna-corresponding-sources.tar.gz dist/SHA256SUMS.txt
